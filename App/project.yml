# XcodeGen spec for the Mixlings prototype app.
# Generate:  brew install xcodegen && cd App && xcodegen generate
# Mixlings.xcodeproj is generated and git-ignored; edit THIS file, not the project.
name: Mixlings

options:
  bundleIdPrefix: com.orizolabs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    # Swift 5 language mode (tools 5.9+). Xcode only accepts major versions here (5 / 6).
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Xcode Cloud overrides this with its own build number on archive.
    CURRENT_PROJECT_VERSION: "1"
    # TODO: set your Apple Developer Team ID (or pick the team in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # NOTE: MIXLINGS_ART_V2 is set per target (below). Setting SWIFT_ACTIVE_COMPILATION_CONDITIONS
    # here would replace XcodeGen's Debug preset value (DEBUG) and silently drop `#if DEBUG`.

packages:
  MixlingsKit:
    path: ../MixlingsKit

targets:
  Mixlings:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
      # C1: privacy manifest (one per target; must be copied as a resource).
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MixlingsKit
        product: MixlingsGenome
      - package: MixlingsKit
        product: MixlingsArt
      - target: MixlingsWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orizolabs.mixlings
        PRODUCT_NAME: Mixlings
        # Art v2 is shipped in MixlingsArt (Phenotype.mood/.stage, renderSilhouette): hooks enabled.
        # Living-world art (Phenotype.weather/.item/.alive, renderRoom/renderJumpRope/renderGlyph)
        # is used ONLY through Shared/Engine/ArtAdapter.swift behind MIXLINGS_ART_LIVING (off).
        # To enable: append " MIXLINGS_ART_LIVING" here AND in MixlingsWidget + MixlingsTests.
        # Weather: WeatherKit is compiled in ONLY with TWEGGS_WEATHERKIT (append it here once the
        # paid account + WeatherKit entitlement below are enabled). Without it the app uses
        # SimulatedWeatherProvider and never imports or calls WeatherKit.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIXLINGS_ART_V2 MIXLINGS_ART_LIVING"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Mixlings-Info.plist
      properties:
        CFBundleDisplayName: Mixlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, uk]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Living world §1: approximate When-In-Use location, asked only when the player turns on
        # "Use my approximate location". uk text: Resources/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: "Your Mixling reacts to the weather where you are. Only your approximate area is used to look up the weather; it never leaves your device except to ask Apple Weather."
        # Weather refresh at most every 3 h (LivingWeatherService.refreshTaskId).
        BGTaskSchedulerPermittedIdentifiers: [com.orizolabs.mixlings.weather]
        UIBackgroundModes: [fetch]
        # Custom scheme: widget taps (mixlings://home) and Simulator testing (mixlings://b/<offerId>).
        CFBundleURLTypes:
          - CFBundleURLName: com.orizolabs.mixlings
            CFBundleURLSchemes: [mixlings]
    entitlements:
      path: Generated/Mixlings.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.orizolabs.mixlings
        # TODO(domain): placeholder. Needs mix.orizolabs.app to serve
        # /.well-known/apple-app-site-association listing <TEAMID>.com.orizolabs.mixlings
        # with path /b/*. Remove this key if signing fails before the domain is live.
        # DEV MODE (free Apple ID / personal team): associated-domains and WeatherKit are disabled
        # until the paid Apple Developer account exists; weather uses the simulated provider.
        # com.apple.developer.associated-domains:
        # - applinks:mix.orizolabs.app
        # # Living world §1. TODO(signing): enable the WeatherKit capability AND the WeatherKit App
        # # Service for com.orizolabs.mixlings in Certificates, Identifiers & Profiles (can take ~30 min
        # # to propagate). Remove this key if signing fails before it's enabled.
        # com.apple.developer.weatherkit: true

  MixlingsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MixlingsWidget
      - path: Shared
      - path: Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MixlingsKit
        product: MixlingsGenome
      - package: MixlingsKit
        product: MixlingsArt
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orizolabs.mixlings.widget
        PRODUCT_NAME: MixlingsWidget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIXLINGS_ART_V2 MIXLINGS_ART_LIVING"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/MixlingsWidget-Info.plist
      properties:
        CFBundleDisplayName: Mixlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/MixlingsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.orizolabs.mixlings

  MixlingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      # Package products are NOT linked here: they are statically linked into the host app
      # (TEST_HOST); linking them again triggers Xcode's "linked as a static library by
      # 'MixlingsTests' and 'Mixlings'... duplication of library code" error.
      - target: Mixlings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orizolabs.mixlings.tests
        GENERATE_INFOPLIST_FILE: YES
        # Same art flag as the host app, so `#if MIXLINGS_ART_V2` tests run.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIXLINGS_ART_V2 MIXLINGS_ART_LIVING"

schemes:
  Mixlings:
    build:
      targets:
        Mixlings: all
        MixlingsWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MixlingsTests
    archive:
      config: Release
  MixlingsWidget:
    build:
      targets:
        MixlingsWidget: all
        Mixlings: all
    run:
      config: Debug
      # Xcode asks which host app / widget kind to launch.
      askForAppToLaunch: true
